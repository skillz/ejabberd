## Local-only proof config: the Skillz chart config (helm-charts/charts/ejabberd)
## translated to the ejabberd 26.09 single-file format. Never point this at a shared DB.

hosts:
  - chat.skillz.com

loglevel: info
certfiles:
  - /opt/ejabberd/conf/server.pem

default_db: sql
sql_type: mysql
sql_server: ejproof-mysql
sql_port: 3306
sql_database: ejabberd
sql_username: ejabberd
sql_password: ejabberd
sql_pool_size: 10
sql_keepalive_interval: 60
update_sql_schema: true

allow_contrib_modules: true
install_contrib_modules:
  - ejabberd_auth_http
  - mod_admin_api_compat
  - mod_vcard_multi
  - mod_global_affiliation
  - mod_privacy_mute
  - mod_mucsub_order
  - mod_muc_keep_archive

auth_method: '@AUTH_METHOD@'
auth_use_cache: false
auth_opts:
  host: "http://ejproof-authstub:8080"
  path_prefix: "/chat-auth/"
  connection_pool_size: 8

listen:
  - port: 5222
    module: ejabberd_c2s
    max_stanza_size: 65536
    shaper: c2s_shaper
    access: c2s
    starttls: true
  - port: 5280
    module: ejabberd_http
    request_handlers:
      /websocket: ejabberd_http_ws
  - port: 5290
    module: ejabberd_http
    request_handlers:
      /api: mod_admin_api_compat

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
  admin:
    user:
      - "skillz-cas@chat.skillz.com"

access_rules:
  local:
    allow: local
  c2s:
    deny: blocked
    allow: all
  configure:
    allow: admin
  muc_create:
    allow: local
  register:
    deny: all
  trusted_network:
    allow: loopback

api_permissions:
  "console commands":
    from: ejabberd_ctl
    who: all
    what: "*"
  "admin access":
    who:
      ip: 0.0.0.0/0
    what:
      - "*"
      - "!stop"
      - "!start"

shaper:
  normal:
    rate: 1000
    burst_size: 20000
  fast: 50000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    5000: admin
    100: all
  c2s_shaper:
    none: admin
    normal: all

max_fsm_queue: 1000

modules:
  mod_admin_extra: {}
  mod_blocking: {}
  mod_disco: {}
  mod_global_affiliation: {}
  mod_http_api: {}
  mod_admin_api_compat: {}
  mod_mam:
    clear_archive_on_room_destroy: false
  mod_muc_keep_archive: {}
  mod_muc:
    access: all
    access_admin:
      allow: admin
    access_create: muc_create
    access_persistent: muc_create
    access_mam: all
    hibernation_timeout: 300
    history_size: 300
    max_users: 10000
    max_user_conferences: 200
    min_message_interval: 0.4
    max_users_presence: 1000
    regexp_room_id: "^([0-9]+|[0-9]+-club-.+|live-event-.+)$"
    default_room_options:
      allow_change_subj: false
      allowpm: anyone
      allow_query_users: false
      allow_visitor_status: false
      anonymous: true
      logging: false
      mam: true
      max_users: 10000
      members_by_default: true
      members_only: false
      moderated: true
      persistent: true
      public: true
      public_list: false
      presence_broadcast: []
  mod_muc_admin: {}
  mod_mucsub_order: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping: {}
  mod_privacy: {}
  mod_privacy_mute: {}
  mod_roster: {}
  mod_vcard:
    search: true
  mod_vcard_multi: {}
