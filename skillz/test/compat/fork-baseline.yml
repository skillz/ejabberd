## The 19.02 fork (prod commit f505dbe46) with the chart's config, minus the plugin repos
## (ModPushSkillz, mod_pottymouth, ModBeamStats) and statsd. Baseline for matrix.js only.
loglevel: 4
hosts:
  - "chat.skillz.com"
  - "chat-admin.skillz.com"
listen:
  - port: 5280
    module: ejabberd_http
    request_handlers:
      "/websocket": ejabberd_http_ws
    http_bind: true
  - port: 5290
    module: ejabberd_http
    request_handlers:
      "/api": mod_http_api
auth_method: internal
auth_use_cache: false
default_db: sql
sql_type: mysql
sql_server: "ejproof-mysql"
sql_secondary_servers:
  - "ejproof-mysql"
sql_port: 3306
sql_database: "ejabberd_fork"
sql_username: "root"
sql_password: "root"
sql_pool_size: 10
acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - "127.0.0.0/8"
  admin:
    - user: "skillz-cas@chat.skillz.com"
    - user: "skillz-cas@chat-admin.skillz.com"
access_rules:
  local:
    - allow: local
  c2s:
    - deny: blocked
    - allow
  configure:
    - allow: admin
  muc_create:
    - allow: local
  register:
    - deny
  trusted_network:
    - allow: loopback
api_permissions:
  "console commands":
    from:
      - ejabberd_ctl
    who: all
    what: "*"
  "admin access":
    who:
      - access:
          - allow:
              - ip: "0.0.0.0/0"
    what:
      - "*"
      - "!stop"
      - "!start"
shaper:
  normal: 1000
  fast: 50000
max_fsm_queue: 1000
shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    - 5000: admin
    - 100
  c2s_shaper:
    - none: admin
    - normal
modules:
  mod_blocking: {}
  mod_block_incoming:
    blocking_users: ["11338313", "1003"]
  mod_block_nonfriends: {}
  mod_disco: {}
  mod_privacy: {}
  mod_vcard:
    search: true
  mod_admin_extra: {}
  mod_http_bind: {}
  mod_mam: {}
  mod_metrics:
    ip: "@STATSD_IP@"
  mod_muc:
    access:
      - allow
    access_admin:
      allow: admin
    access_create: muc_create
    access_persistent: muc_create
    history_size: 300
    max_users: 10000
    max_user_conferences: 200
    min_message_interval: 0.4
    min_presence_interval: 0
    max_users_presence: 1000
    regexp_room_id: "^([0-9]+|[0-9]+-club-.+|live-event-.+)$"
    default_room_options:
      allow_change_subj: false
      allow_private_messages: true
      allow_query_users: false
      allow_visitor_status: false
      anonymous: true
      logging: true
      mam: true
      max_users: 10000
      members_by_default: true
      members_only: false
      moderated: true
      persistent: true
      public: true
      public_list: false
      presence_broadcast: {}
  mod_muc_admin: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping: {}
  mod_roster: {}
