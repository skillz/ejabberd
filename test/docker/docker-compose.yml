version: '3.7'

services:
  mysql:
    image: mysql:8.0
    container_name: ejabberd-mysql
    volumes:
      - mysqldata:/var/lib/mysql
      - ../../sql/mysql.sql:/docker-entrypoint-initdb.d/mysql.sql:ro
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ejabberd_test
      MYSQL_USER: ejabberd_test
      MYSQL_PASSWORD: ejabberd_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ejabberd:
    image: ghcr.io/processone/ejabberd:latest
    container_name: ejabberd-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5222:5222"   # C2S (Client-to-Server)
      - "5269:5269"   # S2S (Server-to-Server)
      - "5280:5280"   # HTTP File Upload
      - "5290:5290"   # WebSocket
      - "4369:4369"   # Erlang Port Mapper Daemon
    environment:
      ERLANG_NODE: ejabberd@localhost
      ERLANG_COOKIE: ejabberd_secret
      EJABBERD_HOME: /home/ejabberd
    volumes:
      - ejabberd_data:/home/ejabberd
      - ../../ejabberd.yml:/home/ejabberd/conf/ejabberd.yml:ro
    restart: always

volumes:
    mysqldata:
      name: ejabberd-mysqldata
    ejabberd_data:
      name: ejabberd-data
